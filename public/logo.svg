<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" fill="none">
  <!-- Original SupeRR Selector Cricket Analytics Shield Crest -->
  <g transform="translate(8, 6)">
    <!-- Subtle Crown Apex (3-point geometric crown) -->
    <path d="M24 14 L29 6 L37 11 L43 3 L49 11 L57 6 L62 14 Z" fill="#D6B46A"/>
    <circle cx="43" cy="3" r="1.6" fill="#E84D87"/>

    <!-- Royal Geometric Shield -->
    <path d="M43 17 L68 23 L68 44 C68 60 56 71 43 76 C30 71 18 60 18 44 L18 23 Z"
          fill="#10152D" stroke="#D6B46A" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M43 21 L63 26 L63 43 C63 56 53 66 43 70 C33 66 23 56 23 43 L23 26 Z"
          fill="#090D1C" stroke="#E84D87" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Stylized Analytics Stumps + Rising Performance Bars -->
    <rect x="33" y="42" width="3.5" height="17" rx="1.2" fill="#A1A8BC"/>
    <rect x="41.25" y="35" width="3.5" height="24" rx="1.2" fill="#D6B46A"/>
    <rect x="49.5" y="30" width="3.5" height="29" rx="1.2" fill="#E84D87"/>

    <!-- Cricket Bails / Trajectory Arc -->
    <path d="M31 39 Q43 27 55 27" stroke="#24C58A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="55" cy="27" r="2.8" fill="#E84D87" stroke="#F4F5FA" stroke-width="0.9"/>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(92, 17)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="900" font-size="22.5" letter-spacing="1.4" fill="#F4F5FA">SUPERR <tspan fill="#E84D87">SELECTOR</tspan></text>
    <text x="0" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="700" font-size="10.5" letter-spacing="2.2" fill="#D6B46A">IPL 2027 AUCTION ANALYTICS</text>
    <text x="0" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="600" font-size="9.2" letter-spacing="0.8" fill="#A1A8BC">SEASON 2 · PRESSURE RELIABILITY ENGINE</text>
  </g>
</svg>
